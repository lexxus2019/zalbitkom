services:
  db:
    image: postgres:16-alpine
    container_name: zalbit-db
    environment:
      POSTGRES_DB: zalbit
      POSTGRES_USER: zalbit
      POSTGRES_PASSWORD: zalbit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zalbit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
